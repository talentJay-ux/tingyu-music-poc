<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8fa"><meta name="description" content="听屿，你的私人音乐空间。搜索歌曲海，免登录收藏音乐，创建属于自己的歌单。">
  <title>听屿 · 你的私人音乐空间</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%23ed4545'/%3E%3Cpath d='M21 40V20h24v17M21 27l24-4' stroke='white' stroke-width='4' fill='none'/%3E%3Ccircle cx='16' cy='41' r='7' fill='white'/%3E%3Ccircle cx='40' cy='38' r='7' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/discover" aria-label="听屿首页"><span class="brand-mark" data-icon="music"></span><span>听屿<span class="brand-en">TINGYU MUSIC</span></span></a>
    <div class="side-label">在线音乐</div>
    <nav class="main-nav" aria-label="音乐导航">
      <a href="#/discover" data-nav="discover"><span data-icon="compass"></span>发现音乐</a>
      <a href="#/charts" data-nav="charts"><span data-icon="chart"></span>歌曲海目录</a>
      <a href="#/search" data-nav="search"><span data-icon="search"></span>搜索音乐</a>
    </nav>
    <div class="side-label second">我的音乐</div>
    <nav class="main-nav" aria-label="我的音乐">
      <a href="#/liked" data-nav="liked"><span data-icon="heart"></span>我喜欢的音乐<span class="nav-count" id="liked-count">0</span></a>
      <a href="#/recent" data-nav="recent"><span data-icon="clock"></span>最近播放</a>
      <a href="#/library" data-nav="library"><span data-icon="library"></span>我的歌单</a>
    </nav>
    <div class="side-label playlist-label"><span>创建的歌单</span><button class="icon-button" data-action="create" aria-label="新建歌单" title="新建歌单"><span data-icon="plus"></span></button></div>
    <nav id="sidebar-playlists" class="main-nav small-nav" aria-label="创建的歌单"></nav>
    <div class="side-bottom"><div class="local-avatar" data-icon="headphones"></div><div><strong>听歌，不必登录</strong><span>你的收藏，留在这台设备</span></div><button class="icon-button" data-action="settings" aria-label="数据与备份" title="数据与备份"><span data-icon="settings"></span></button></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="header-start"><button class="icon-button menu-toggle" data-action="menu" aria-label="打开菜单"><span data-icon="menu"></span></button><button class="icon-button back-button" data-action="back" aria-label="返回上一页"><span data-icon="chevron-left"></span></button><span class="header-location" id="header-location">发现音乐</span></div><form id="search-form" role="search"><span data-icon="search"></span><input id="global-search" aria-label="搜索歌曲或歌手" placeholder="搜索歌曲、歌手，发现你的下一首心动" maxlength="50" autocomplete="off"><kbd>⌘ K</kbd></form><button class="device-badge" data-action="settings"><span class="status-dot"></span>免登录 · 本地收藏</button></header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer"><span>让喜欢的音乐，有一个自己的小岛。</span><a href="https://www.soundhelix.com/audio-examples" target="_blank" rel="noopener noreferrer">测试音频：SoundHelix <span data-icon="external"></span></a></footer>
  </div>
  <div class="player" role="region" aria-label="音乐播放器">
    <button class="now-cover" id="now-cover" data-action="lyrics" aria-label="查看当前歌曲歌词"><span data-icon="music"></span></button>
    <div class="now-meta"><button id="now-title" data-action="lyrics">还没有开始播放</button><span id="now-artist">选一首歌，让心情有个落点</span></div>
    <button class="icon-button player-like" id="player-like" data-action="like-current" aria-label="喜欢当前歌曲"><span data-icon="heart"></span></button>
    <div class="transport"><div class="transport-controls"><button class="icon-button" id="mode-button" data-action="mode" aria-label="播放模式：顺序播放" title="顺序播放"><span data-icon="repeat"></span></button><button class="icon-button" data-action="previous" aria-label="上一首"><span data-icon="skip-back"></span></button><button class="play-main" id="play-toggle" data-action="toggle" aria-label="播放"><span data-icon="play"></span></button><button class="icon-button" data-action="next" aria-label="下一首"><span data-icon="skip-forward"></span></button><button class="icon-button" data-action="lyrics" aria-label="查看歌词"><span class="lyric-icon">词</span></button></div><div class="progress-row"><span id="elapsed">00:00</span><input type="range" id="progress" min="0" max="1000" value="0" aria-label="播放进度"><span id="duration">00:00</span></div></div>
    <div class="player-tools"><span class="source-chip">POC</span><button class="icon-button" data-action="mute" id="mute-button" aria-label="静音"><span data-icon="volume"></span></button><input type="range" id="volume" min="0" max="100" value="70" aria-label="音量"><span class="tool-divider"></span><button class="icon-button queue-button" data-action="queue" aria-label="打开播放队列"><span data-icon="queue"></span><span id="queue-count">0</span></button></div>
  </div>
  <audio id="audio" preload="metadata" playsinline></audio>
  <div class="drawer-scrim" id="drawer-scrim" hidden></div><aside id="drawer" class="drawer" hidden></aside>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script type="module" src="./app.js"></script>
</body>
</html>
