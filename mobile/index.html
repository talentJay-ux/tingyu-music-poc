<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fbf9f6">
<meta name="description" content="听屿，为手机打造的私人音乐空间。歌曲海真实曲库，免登录创建歌单、收藏和播放音乐。">
<meta name="api-origin" content="https://tingyu-music-jay.xkcnjsfdny.chatgpt.site">
<title>听屿 · 手机音乐空间</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%23eb514d'/%3E%3Cpath d='M24 42V17l24-4v24M24 25l24-4' stroke='white' stroke-width='4' fill='none'/%3E%3Ccircle cx='18' cy='43' r='8' fill='white'/%3E%3Ccircle cx='42' cy='38' r='8' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./mobile.css">
</head>
<body>
<div class="app-shell">
<header class="app-header"><a href="#/discover" class="brand" aria-label="听屿首页"><span class="brand-icon" data-icon="music"></span><span>听屿<small>把喜欢的音乐，留在身边</small></span></a><button class="round-button" data-action="settings" aria-label="数据与设置"><span data-icon="settings"></span></button></header>
<main id="main" tabindex="-1"></main>
<div id="mini-player" class="mini-player" hidden><button class="mini-open" data-action="now-playing" aria-label="展开正在播放"><span id="mini-cover" class="mini-cover"></span><span class="mini-meta"><strong id="mini-title"></strong><small id="mini-artist"></small></span></button><button id="mini-toggle" class="mini-toggle" data-action="toggle" aria-label="播放当前歌曲"></button><button class="round-button" data-action="queue" aria-label="播放队列"><span data-icon="queue"></span></button><div class="mini-progress"><span id="mini-progress-fill"></span></div></div>
<nav class="bottom-nav" aria-label="主导航"><a href="#/discover" data-nav="discover"><span data-icon="compass"></span><span>发现</span></a><a href="#/search" data-nav="search"><span data-icon="search"></span><span>搜索</span></a><a href="#/library" data-nav="library"><span data-icon="library"></span><span>我的音乐</span></a></nav>
</div>
<dialog id="sheet" class="sheet"><div class="sheet-handle"></div><div id="sheet-content"></div></dialog>
<dialog id="player-screen" class="player-dialog"><div class="player-top"><button class="round-button" data-action="close-player" aria-label="收起播放器"><span data-icon="chevron-down"></span></button><span>正在播放<small>歌曲海 · 在线音乐</small></span><button class="round-button" data-action="current-menu" aria-label="歌曲更多操作"><span data-icon="more"></span></button></div><div class="player-body"><div id="player-art" class="player-art"></div><div id="lyrics-pane" class="lyrics-pane" hidden></div><div class="player-title-row"><div><h1 id="player-title">选择一首喜欢的音乐</h1><p id="player-artist"></p></div><button id="player-like" class="round-button" data-action="like-current" aria-label="喜欢当前歌曲"></button></div><p id="player-error" class="player-error" hidden></p><a id="source-play" class="text-button" rel="noopener noreferrer" hidden>歌曲海原站播放器 ↗</a><a id="source-mode-link" class="text-button" hidden>启用歌曲海直连版</a><div class="player-progress"><input id="seek" disabled type="range" min="0" max="1000" value="0" aria-label="播放进度"><div class="time-row"><span id="elapsed">00:00</span><span id="duration">00:00</span></div></div><div class="player-controls"><button id="mode-button" class="round-button" data-action="mode" aria-label="播放模式：顺序播放"></button><button class="transport-button" data-action="previous" aria-label="上一首"><span data-icon="previous"></span></button><button id="full-toggle" class="full-toggle" data-action="toggle" aria-label="播放"></button><button class="transport-button" data-action="next" aria-label="下一首"><span data-icon="next"></span></button><button class="round-button" data-action="queue" aria-label="打开播放队列"><span data-icon="queue"></span></button></div><div class="player-extras"><button id="lyrics-button" class="text-button" data-action="lyrics">歌词</button><span>听屿 · TINGYU</span><button class="text-button" data-action="add-current">加入歌单</button></div><label class="volume-row"><span data-icon="volume"></span><input id="volume" type="range" min="0" max="100" value="75" aria-label="音量"></label></div></dialog>
<audio id="audio" playsinline preload="metadata"></audio>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="backup-file" type="file" accept="application/json,.json" hidden>
<script type="module" src="./mobile.js"></script>
</body>
</html>
