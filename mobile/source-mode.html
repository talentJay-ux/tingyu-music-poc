<p>要让榜单、收藏和自建歌单都采用原站播放，可在听屿「数据与设置」开启「原站搜索与播放」。</p><h2>在歌曲海使用听屿界面</h2><ol><li>使用支持用户脚本的浏览器，并启用用户脚本管理器。</li><li><a href="./tingyu.user.js">安装听屿用户脚本</a>。脚本仅在歌曲海的听屿入口运行。</li><li><a id="launch" href="https://www.gequhai.com/#/tingyu/discover">打开歌曲海上的听屿</a>。</li></ol><p><small>独立域名使用独立浏览器存储。要带走歌单，可在听屿设置里导出，再到直连版导入。</small></p></main>
<script>
const original=document.querySelector('#original'),launch=document.querySelector('#launch');
