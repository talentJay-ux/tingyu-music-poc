name: Inspect public Gequhai sitemap
on: [push]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/inspect-sitemap.py --ids sitemap-ids.json
      - uses: actions/upload-artifact@v4
        with:
          name: sitemap-ids
          path: sitemap-ids.json
